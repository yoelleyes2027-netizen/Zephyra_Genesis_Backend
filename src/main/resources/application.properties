spring.application.name=zephyra-genesis-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zephyra_genesis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.admin-datasource.url=${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/zephyra_admins}
spring.admin-datasource.username=${ADMIN_DB_USERNAME:postgres}
spring.admin-datasource.password=${ADMIN_DB_PASSWORD:postgres}
spring.admin-datasource.bootstrap-url=${ADMIN_DB_BOOTSTRAP_URL:jdbc:postgresql://localhost:5432/postgres}
spring.admin-datasource.bootstrap-username=${ADMIN_DB_BOOTSTRAP_USERNAME:postgres}
spring.admin-datasource.bootstrap-password=${ADMIN_DB_BOOTSTRAP_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Montevideo
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Montevideo'
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Montevideo
spring.jackson.date-format=yyyy-dd-MM HH:mm:ss
spring.mvc.format.date-time=yyyy-dd-MM HH:mm:ss
server.port=${SERVER_PORT:8080}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:zephyra-genesis-documents}
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}
